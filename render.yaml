services:
  - type: web
    name: nagar-drishti-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ENABLE_TELEMETRY_SIMULATION
        value: "true"
      - key: SIMULATION_INTERVAL_MS
        value: "6000"
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
